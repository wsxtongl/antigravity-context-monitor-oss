<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity 上下文与 Token 监控</title>
  <style>
    :root {
      --bg: var(--color-background-secondary, #f6f8fb);
      --surface: var(--color-background-primary, #ffffff);
      --surface-2: var(--color-background-tertiary, #f1f5f9);
      --border: var(--color-border-primary, #e2e8f0);
      --text: var(--color-text-primary, #0f172a);
      --text-muted: var(--color-text-secondary, #64748b);
      --accent-primary: var(--color-text-info, #2563eb);
      --accent-primary-soft: rgba(37, 99, 235, 0.12);
      --accent-ok: var(--color-text-success, #16a34a);
      --accent-ok-soft: rgba(22, 163, 74, 0.14);
      --accent-warn: var(--color-text-warning, #d97706);
      --accent-warn-soft: rgba(217, 119, 6, 0.14);
      --accent-danger: var(--color-text-danger, #dc2626);
      --radius: 10px;
    }

    [data-theme="dark"] {
      --bg: var(--color-background-secondary, #0f1419);
      --surface: var(--color-background-primary, #161b22);
      --surface-2: var(--color-background-tertiary, #21262d);
      --border: var(--color-border-primary, #30363d);
      --text: var(--color-text-primary, #e6edf3);
      --text-muted: var(--color-text-secondary, #8b949e);
      --accent-primary: var(--color-text-info, #58a6ff);
      --accent-primary-soft: rgba(88, 166, 255, 0.15);
      --accent-ok: var(--color-text-success, #3fb950);
      --accent-ok-soft: rgba(63, 185, 80, 0.16);
      --accent-warn: var(--color-text-warning, #d29922);
      --accent-warn-soft: rgba(210, 153, 34, 0.16);
      --accent-danger: var(--color-text-danger, #f85149);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-ok);
      box-shadow: 0 0 0 3px var(--accent-ok-soft);
      flex-shrink: 0;
    }
    .brand h1 {
      font-size: 14px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 12px;
    }

    button, select, input {
      font: inherit;
      font-size: 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 8px;
      outline: none;
    }
    button { cursor: pointer; }
    button:hover { background: var(--surface-2); }
    button.active {
      background: var(--accent-primary-soft);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .pricing-drawer {
      display: none;
      padding: 12px 14px 0;
    }
    .pricing-body {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .price-row {
      display: grid;
      grid-template-columns: minmax(150px, 1.4fr) repeat(3, minmax(84px, 1fr));
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      background: var(--surface-2);
      border-radius: 8px;
    }
    @media (max-width: 600px) {
      .price-row { grid-template-columns: 1fr 1fr 1fr; }
      .price-model { grid-column: 1 / -1; }
    }
    .price-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .price-field input { width: 100%; }
    .rate-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .mobile-picker {
      display: none;
      padding: 10px 14px 0;
    }
    .mobile-picker select { width: 100%; }

    .range-bar {
      padding: 10px 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .range-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .range-btn {
      padding: 4px 9px;
      font-size: 12px;
      border-radius: 999px;
    }
    .date-inputs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .date-inputs input[type="date"] {
      padding: 3px 6px;
      font-size: 11.5px;
    }

    .period-section {
      padding: 12px 14px 0;
      display: none;
    }
    .period-section.open { display: block; }
    .trend-head-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .trend-legend {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .segmented {
      display: inline-flex;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
    }
    .segmented button {
      border: none;
      background: transparent;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .segmented button:hover {
      background: transparent;
      color: var(--text);
    }
    .segmented button.active {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .bar-chart-stage {
      position: relative;
    }
    svg.bar-chart { width: 100%; height: 195px; display: block; }
    svg.chart { width: 100%; height: 190px; display: block; }
    .chart-tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 30;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 11.5px;
      line-height: 1.55;
      color: var(--text);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.16);
      min-width: 195px;
      display: none;
      font-variant-numeric: tabular-nums;
    }
    .chart-tooltip .tt-title {
      font-weight: 700;
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .chart-tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .period-table-wrap {
      overflow-x: auto;
      max-height: 240px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 12px 14px 0;
    }
    .stat-mini {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .stat-mini .label { font-size: 11px; color: var(--text-muted); }
    .stat-mini .value {
      font-size: 17px;
      font-weight: 700;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .stat-mini .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .cost-val { color: var(--accent-warn); }
    .cost-inline {
      color: var(--accent-warn);
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 12px;
      padding: 12px 14px 18px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar-panel { display: none; }
      .mobile-picker { display: block; }
      .col-model { display: none; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .panel-header h2 { font-size: 13px; font-weight: 700; }
    .title-block { min-width: 0; }
    .title-block h2 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--accent-primary-soft);
      color: var(--accent-primary);
      font-weight: 600;
      flex-shrink: 0;
    }
    .badge-ok {
      background: var(--accent-ok-soft);
      color: var(--accent-ok);
    }
    .badge-warn {
      background: var(--accent-warn-soft);
      color: var(--accent-warn);
    }

    .search-box {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input { width: 100%; }

    .conv-list {
      max-height: calc(100vh - 260px);
      overflow-y: auto;
    }
    .conv-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .conv-item:last-child { border-bottom: none; }
    .conv-item:hover { background: var(--surface-2); }
    .conv-item.selected {
      background: var(--accent-primary-soft);
      border-left: 3px solid var(--accent-primary);
      padding-left: 9px;
    }
    .conv-title {
      font-size: 12.5px;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .conv-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      gap: 6px;
    }
    .live-tag { color: var(--accent-ok); }
    .mini-bar {
      height: 4px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .mini-bar-fill { height: 100%; border-radius: 99px; }

    .detail-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 12px;
      padding: 12px;
    }
    @media (max-width: 600px) {
      .hero-grid { grid-template-columns: 1fr; }
    }

    .gauge-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .gauge-wrap { position: relative; width: 132px; height: 132px; }
    .gauge-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .gauge-pct { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .gauge-sub { font-size: 11px; color: var(--text-muted); }
    .gauge-caption { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
    }
    .kpi-card {
      background: var(--surface-2);
      border-radius: 8px;
      padding: 10px;
    }
    .k-label { font-size: 11px; color: var(--text-muted); }
    .k-val {
      font-size: 16px;
      font-weight: 700;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    .model-val { font-size: 13px; }
    .k-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .chart-wrap { padding: 10px 12px 12px; }
    .chart-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-right { margin-left: auto; }
    .swatch { width: 9px; height: 9px; border-radius: 2px; }
    svg.chart { width: 100%; height: 190px; display: block; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px;
    }
    .chips-tight { padding-top: 0; }
    .chip {
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .table-wrap {
      overflow-x: auto;
    }
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      color: var(--text-muted);
    }
    .pagination-controls {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .pagination-controls button {
      padding: 3px 8px;
      font-size: 11.5px;
    }
    .pagination-controls button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }
    .pagination-controls button:disabled:hover {
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      text-align: left;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--surface-2);
      color: var(--text-muted);
      font-weight: 600;
      z-index: 2;
    }
    tr:hover td { background: var(--surface-2); }
    td.num, th.num { text-align: right; }

    .muted { color: var(--text-muted); }
    .small { font-size: 11px; }

    .tag-tool {
      display: inline-block;
      font-size: 10.5px;
      padding: 1px 5px;
      border-radius: 5px;
      background: var(--accent-primary-soft);
      color: var(--accent-primary);
      margin-right: 4px;
    }
    .tag-compact {
      display: inline-block;
      font-size: 10.5px;
      padding: 1px 5px;
      border-radius: 5px;
      background: var(--accent-warn-soft);
      color: var(--accent-warn);
      margin-left: 4px;
    }

    .empty {
      padding: 28px 14px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .footer-note {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 14px 14px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" id="liveDot"></span>
      <h1>上下文与 Token 监控</h1>
    </div>
    <div class="controls">
      <select id="limitSelect" title="上下文参考上限">
        <option value="auto">上限：自动</option>
        <option value="128000">128K</option>
        <option value="200000">200K</option>
        <option value="500000">500K</option>
        <option value="1000000">1M</option>
        <option value="2000000">2M</option>
      </select>
      <select id="refreshIntervalSelect" title="自动刷新频率">
        <option value="10000">刷新：10秒</option>
        <option value="30000">刷新：30秒</option>
        <option value="60000">刷新：60秒</option>
        <option value="0">刷新：关闭</option>
      </select>
      <button id="currencyBtn" title="切换美元 / 人民币">$ USD</button>
      <button id="pricingBtn" title="自定义各模型每百万 Token 单价">价格设置</button>
      <button id="refreshBtn">刷新</button>
    </div>
  </header>

  <section id="pricingDrawer" class="pricing-drawer"></section>

  <section class="range-bar" id="rangeBar">
    <div class="range-group">
      <button class="range-btn active" data-range="today">今天</button>
      <button class="range-btn" data-range="3d">近 3 天</button>
      <button class="range-btn" data-range="7d">近 7 天</button>
      <button class="range-btn" data-range="30d">近 30 天</button>
      <button class="range-btn" data-range="all">全部</button>
    </div>
    <div class="range-group">
      <span class="date-inputs">
        <input id="startDateInput" type="date" title="开始日期" />
        <span>~</span>
        <input id="endDateInput" type="date" title="结束日期" />
      </span>
      <button id="togglePeriodBtn" title="展开或收起使用趋势图">使用趋势</button>
    </div>
  </section>

  <div class="mobile-picker">
    <select id="convSelect"></select>
  </div>

  <section class="summary-strip" id="summaryStrip"></section>

  <section class="period-section" id="periodSection"></section>

  <main class="layout">
    <aside class="panel sidebar-panel">
      <div class="panel-header">
        <h2>本地会话</h2>
        <span id="convCountBadge" class="badge">0</span>
      </div>
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜索会话 / ID / 模型..." />
      </div>
      <div class="conv-list" id="convList">
        <div class="empty">正在连接监控服务...</div>
      </div>
    </aside>

    <section class="detail-stack" id="detailArea">
      <div class="panel"><div class="empty">正在读取本地会话上下文数据...</div></div>
    </section>
  </main>
